name = "kabaca-leaderboard"
main = "src/worker.js"
compatibility_date = "2026-11-01"
workers_dev = true
# The app's address (manifest "leaderboard"): workers.dev is blocked by
# Turkish operators (SNI), so the Worker is served on its own domain too.
# kabaca.app is on this Cloudflare account; Wrangler makes the DNS record
# for api.kabaca.app itself. workers_dev stays on for older manifests.
# Must stay above the [sections] below.
routes = [{ pattern = "api.kabaca.app", custom_domain = true }]

# Daily clean-up of the hashed IPs used by the registration limit.
[triggers]
crons = ["0 0 * * *"]

[vars]
CONTENT_BASE = "https://yerdema.github.io/aralik/content/"
FULL_BOARD_AT = "100"
SMALL_BOARD = "10"
FULL_BOARD = "50"
REGISTER_LIMIT = "5"
RENAME_DAYS = "3"
SUSPECT_POINTS = "470"
BOARD_CACHE_SECONDS = "30"

# Per-IP limit on opening, joining and searching for duels (src/index.js,
# limitDuel). namespace_id is any number unique to this account.
[[ratelimits]]
name = "DUEL_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[d1_databases]]
binding = "DB"
database_name = "kabaca-leaderboard"
# Filled in after `npx wrangler d1 create kabaca-leaderboard` (see README.md).
database_id = "33c22d8e-4c17-4a60-8fc0-cee7208cf1bc"

# Real-time duel rooms (src/duel_room.js). SQLite-backed, so they run on the
# free plan.
[[durable_objects.bindings]]
name = "DUEL_ROOMS"
class_name = "DuelRoom"

# The lobby that pairs random opponents (src/duel_lobby.js).
[[durable_objects.bindings]]
name = "DUEL_LOBBY"
class_name = "DuelLobby"

# Tournament rooms, three to eight players (src/tournament_room.js).
[[durable_objects.bindings]]
name = "TOURNAMENT_ROOMS"
class_name = "TournamentRoom"

[[migrations]]
tag = "v1-duel"
new_sqlite_classes = ["DuelRoom"]

[[migrations]]
tag = "v2-duel-lobby"
new_sqlite_classes = ["DuelLobby"]

[[migrations]]
tag = "v3-tournament"
new_sqlite_classes = ["TournamentRoom"]
