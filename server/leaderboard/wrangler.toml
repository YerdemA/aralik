name = "kabaca-leaderboard"
main = "src/worker.js"
compatibility_date = "2026-11-01"
workers_dev = true
# Optional: serve on your own domain too (its DNS must be on this Cloudflare
# account and the name must not have a DNS record yet). Must stay above the
# [sections] below.
# routes = [{ pattern = "kabaca.example.com", custom_domain = true }]

# Daily clean-up of the hashed IPs used by the registration limit.
[triggers]
crons = ["0 0 * * *"]

[vars]
CONTENT_BASE = "https://yerdema.github.io/aralik/content/"
FULL_BOARD_AT = "100"
SMALL_BOARD = "10"
FULL_BOARD = "50"
REGISTER_LIMIT = "5"

[[d1_databases]]
binding = "DB"
database_name = "kabaca-leaderboard"
# Filled in after `npx wrangler d1 create kabaca-leaderboard` (see README.md).
database_id = "33c22d8e-4c17-4a60-8fc0-cee7208cf1bc"

# Real-time duel rooms (src/duel_room.js). SQLite-backed, so they run on the
# free plan.
[[durable_objects.bindings]]
name = "DUEL_ROOMS"
class_name = "DuelRoom"

# The lobby that pairs random opponents (src/duel_lobby.js).
[[durable_objects.bindings]]
name = "DUEL_LOBBY"
class_name = "DuelLobby"

[[migrations]]
tag = "v1-duel"
new_sqlite_classes = ["DuelRoom"]

[[migrations]]
tag = "v2-duel-lobby"
new_sqlite_classes = ["DuelLobby"]
