# Signs the iOS app and uploads it to App Store Connect (TestFlight), on a
# macOS runner, since there is no Mac. Run by hand (Actions → iOS release →
# Run workflow); does nothing useful until the repository secrets below exist.
#
# Signing is manual (a distribution certificate and an App Store profile),
# not Xcode's automatic signing: a fresh runner has no keychain, and
# automatic signing would mint a new certificate on every run.
#
# Secrets:
#   APPLE_TEAM_ID           the 10-character Team ID
#   IOS_DIST_CERT_P12       base64 of the distribution certificate (.p12)
#   IOS_DIST_CERT_PASSWORD  its password
#   IOS_PROFILE             base64 of the App Store provisioning profile
#                           for com.yerdema.kabaca (Associated Domains on)
#   ASC_KEY_ID              App Store Connect API key ID
#   ASC_ISSUER_ID           its issuer ID
#   ASC_KEY_P8              the key file's text (-----BEGIN PRIVATE KEY-----)
name: iOS release

on:
  workflow_dispatch:
    inputs:
      build-number:
        description: 'Build number (empty: the +N in pubspec.yaml)'
        required: false
        default: ''
      upload:
        description: 'Upload to App Store Connect'
        type: boolean
        default: true

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
      IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
      IOS_PROFILE: ${{ secrets.IOS_PROFILE }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Check the secrets
        run: |
          missing=""
          for name in APPLE_TEAM_ID IOS_DIST_CERT_P12 IOS_DIST_CERT_PASSWORD IOS_PROFILE; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ "${{ inputs.upload }}" = "true" ]; then
            for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
              [ -n "${!name}" ] || missing="$missing $name"
            done
          fi
          if [ -n "$missing" ]; then
            echo "::error title=Missing secrets::$missing"
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Install the certificate and the profile
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          pass="$(uuidgen)"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          echo "$IOS_DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$IOS_DIST_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$pass" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          profile="$RUNNER_TEMP/kabaca.mobileprovision"
          echo "$IOS_PROFILE" | base64 --decode > "$profile"
          security cms -D -i "$profile" > "$RUNNER_TEMP/profile.plist"
          uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$profile" "$dir/$uuid.mobileprovision"
          done
          echo "PROFILE_NAME=$name" >> "$GITHUB_ENV"
          echo "Profile: $name ($uuid)"

      # Release.xcconfig is the base of the Runner target only, so the Swift
      # packages are not asked for a provisioning profile.
      - name: Signing settings
        run: |
          cat >> ios/Flutter/Release.xcconfig <<EOF
          CODE_SIGN_STYLE=Manual
          DEVELOPMENT_TEAM=$APPLE_TEAM_ID
          CODE_SIGN_IDENTITY=Apple Distribution
          CODE_SIGN_IDENTITY[sdk=iphoneos*]=Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER=$PROFILE_NAME
          EOF
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict><key>com.yerdema.kabaca</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF

      - name: Build the IPA
        run: |
          set -o pipefail
          number="${{ inputs.build-number }}"
          flutter build ipa --release \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist" \
            ${number:+--build-number=$number} 2>&1 | tee build.log
          ls -la build/ios/ipa

      - name: Errors as annotations
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          grep -E "error:|Error:|error \(" build.log | head -40 > errors.txt || true
          if [ ! -s errors.txt ]; then tail -40 build.log > errors.txt; fi
          body=$(sed 's/%/%25/g' errors.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=iOS release::${body}"

      - name: Upload to App Store Connect
        if: inputs.upload
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$ASC_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          xcrun altool --upload-app --type ios -f build/ios/ipa/*.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Keep the IPA
        uses: actions/upload-artifact@v4
        with:
          name: kabaca-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 14

      - name: Clean up
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/dist.p12" "$HOME/.appstoreconnect/private_keys/"*.p8
